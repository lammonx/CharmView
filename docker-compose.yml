version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      # 构建时限制资源
      args:
        - NODE_OPTIONS=--max_old_space_size=2048
    container_name: charmview
    ports:
      - "80:80"
      - "443:443"  # 添加HTTPS端口
    restart: unless-stopped
    # 运行时资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 挂载SSL证书
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro