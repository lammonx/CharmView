server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location ~* ^/charmview/static/(js|css)/ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /charmview {
        try_files $uri $uri/ /charmview/index.html;
    }
}