server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查端点
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # 根路径重定向到应用（使用302临时重定向，浏览器兼容性更好）
    location = / {
        return 302 /charmview/;
    }

    # 静态资源缓存
    location ~* ^/charmview/static/(js|css|media)/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 应用路由
    location /charmview {
        try_files $uri $uri/ /charmview/index.html;
    }
}