# HTTP服务器 - 重定向到HTTPS
server {
    listen 80;
    server_name lammon.cn;
    
    # Let's Encrypt验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他请求重定向到HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS服务器
server {
    listen 443 ssl http2;
    server_name lammon.cn;

    root /usr/share/nginx/html;
    index index.html;

    # SSL证书配置
    ssl_certificate /etc/letsencrypt/live/lammon.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lammon.cn/privkey.pem;
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 健康检查端点（仅HTTP）
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # 根路径重定向到应用
    location = / {
        return 302 /charmview/;
    }

    # 静态资源缓存
    location ~* ^/charmview/static/(js|css|media)/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 应用路由
    location /charmview {
        try_files $uri $uri/ /charmview/index.html;
    }
}